name: R reference and site checks

on:
  push:
    branches: [main]
  pull_request:

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: r-lib/actions/setup-r@v2
        with:
          use-public-rspm: true
      - name: Install site render dependencies and optional data
        run: |
          Rscript -e 'install.packages(c("knitr", "rmarkdown", "palmerpenguins"), repos="https://cloud.r-project.org")'
      - name: Build and check the offline reference package
        run: |
          cd "$RUNNER_TEMP"
          R CMD build "$GITHUB_WORKSPACE"
          R CMD check --no-manual rulearn_*.tar.gz
      - name: Install package for worked site examples
        run: R CMD INSTALL .
      - uses: quarto-dev/quarto-actions/setup@v2
      - name: Render the searchable reference and walkthrough site
        run: quarto render