name: RU Windows full-package installation and regression
on:
  push:
    branches:
      - main
      - steward/e1db3feb/ru-win-full-install
permissions:
  contents: read
jobs:
  windows-install-and-ci:
    runs-on: windows-2025
    timeout-minutes: 50
    steps:
      - uses: actions/checkout@v4
      - uses: r-lib/actions/setup-r@v2
        with:
          r-version: 'release'
      - name: Create isolated user R library outside source checkout
        shell: pwsh
        run: |
          $library = Join-Path $env:RUNNER_TEMP 'ru-public-lib'
          New-Item -ItemType Directory -Force -Path $library | Out-Null
          "R_LIBS_USER=$library" >> $env:GITHUB_ENV
      - name: Verify Windows R and fresh user library
        shell: Rscript {0}
        run: |
          stopifnot(.Platform$OS.type == "windows")
          dir.create(Sys.getenv("R_LIBS_USER"), recursive=TRUE, showWarnings=FALSE)
          .libPaths(c(Sys.getenv("R_LIBS_USER"), .Library))
          stopifnot(!startsWith(
            normalizePath(Sys.getenv("R_LIBS_USER"),winslash="/",mustWork=TRUE),
            normalizePath(getwd(),winslash="/",mustWork=TRUE)))
          cat("WINDOWS_R_VERSION=", as.character(getRversion()), "\n")
          cat("FIRST_USER_LIBRARY=", .libPaths()[[1L]], "\n")
      - name: Install the complete candidate through standard GitHub dependencies
        shell: Rscript {0}
        run: |
          .libPaths(c(Sys.getenv("R_LIBS_USER"), .Library))
          options(repos = c(CRAN="https://cloud.r-project.org"))
          install.packages("remotes")
          if (identical(Sys.getenv("GITHUB_REF_NAME"), "main")) {
            remotes::install_github("dudechilling/R-u-learning-yet")
          } else {
            remotes::install_github("dudechilling/R-u-learning-yet",
                                    ref="steward/e1db3feb/ru-win-full-install")
          }
          library(rulearn)
          stopifnot(identical(
            utils::packageDescription("rulearn")$RemoteSha,
            Sys.getenv("GITHUB_SHA")))
          required <- c("bslib","digest","filelock","learnr",
                        "palmerpenguins","rstudioapi","shiny")
          stopifnot(all(vapply(required,requireNamespace,logical(1L),
                               quietly=TRUE)))
          stopifnot(length(getNamespaceExports("rulearn"))==33L)
          stopifnot(identical(ru_learn()$status, "SELECTOR"))
          cap <- ru_capabilities()
          stopifnot(all(cap$packages$installed))
          cat("WINDOWS_FULL_PACKAGE_DEPENDENCIES_PASS\n")
      - name: Verify Windows checkout and installed instructional CSV bytes
        shell: Rscript {0}
        run: |
          library(rulearn)
          files <- c("sites-intro-v1.csv","sites-transfer-v1.csv")
          expected <- c("3166dcb4137ce10342f5bed98004c71e28e3aace1a0c088c7fa7c33da8f3834a",
                        "45879c7bc71dc297f5b862f090931637f9d0ddfb718c4107baed1ca7c773c26a")
          for (i in seq_along(files)) {
            source_file <- file.path("inst","tutorials","ru-learning-foundations",
                                     "data",files[[i]])
            installed_file <- system.file("tutorials","ru-learning-foundations",
                                          "data",files[[i]],package="rulearn",
                                          mustWork=TRUE)
            actual <- c(digest::digest(source_file,algo="sha256",file=TRUE),
                        digest::digest(installed_file,algo="sha256",file=TRUE))
            cat("CSV_BYTE_HASHES_",files[[i]],"=",paste(actual,collapse=","),"\n")
            stopifnot(all(actual==expected[[i]]))
          }
          cat("WINDOWS_AUTHORITATIVE_CSV_BYTES_PASS\n")
      - name: Run unchanged full-source R CMD build check and all regressions
        shell: Rscript {0}
        run: |
          .libPaths(c(Sys.getenv("R_LIBS_USER"), .Library))
          options(repos = c(CRAN="https://cloud.r-project.org"))
          Sys.setenv(RULEARN_CI_OUTPUT=file.path(Sys.getenv("RUNNER_TEMP"),"ru-full-ci"))
          source("scripts/ci-check.R",local=globalenv())
          cat("WINDOWS_ORIGINAL_SOURCE_CI_PASS\n")