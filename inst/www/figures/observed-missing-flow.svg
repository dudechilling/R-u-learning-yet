<svg xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="w2-title w2-desc" viewBox="0 0 640 300" width="640" height="300">
  <title id="w2-title">Four constructed temperature readings and a missingness decision</title>
  <desc id="w2-desc">Four readings in degrees Celsius: 13, missing, 18, 20. One is missing. If an observed-case exclusion is explicitly justified, three readings remain and their mean is 17 degrees Celsius. This does not replace the source or explain why a value is missing.</desc>
  <rect width="640" height="300" fill="#FAF8F4"/>
  <text x="24" y="37" fill="#273640" font-family="system-ui, sans-serif" font-size="22" font-weight="700">Four constructed readings (°C)</text>
  <g font-family="system-ui, sans-serif" text-anchor="middle">
    <rect x="24" y="58" width="136" height="102" rx="8" fill="#FFFFFF" stroke="#28627A" stroke-width="3"/>
    <text x="92" y="116" fill="#273640" font-size="34" font-weight="700">13</text>
    <rect x="176" y="58" width="136" height="102" rx="8" fill="#FFFFFF" stroke="#C66A49" stroke-width="3" stroke-dasharray="7 5"/>
    <text x="244" y="110" fill="#273640" font-size="29" font-weight="700">NA</text>
    <text x="244" y="138" fill="#273640" font-size="14">missing</text>
    <rect x="328" y="58" width="136" height="102" rx="8" fill="#FFFFFF" stroke="#28627A" stroke-width="3"/>
    <text x="396" y="116" fill="#273640" font-size="34" font-weight="700">18</text>
    <rect x="480" y="58" width="136" height="102" rx="8" fill="#FFFFFF" stroke="#28627A" stroke-width="3"/>
    <text x="548" y="116" fill="#273640" font-size="34" font-weight="700">20</text>
  </g>
  <path d="M320 170 V195" stroke="#28627A" stroke-width="3"/>
  <path d="M314 189 L320 199 L326 189" fill="none" stroke="#28627A" stroke-width="3"/>
  <rect x="24" y="208" width="592" height="74" rx="9" fill="#FFFFFF" stroke="#E1E4E0" stroke-width="2"/>
  <text x="320" y="237" text-anchor="middle" fill="#273640" font-family="system-ui, sans-serif" font-size="20" font-weight="700">After a documented exclusion decision</text>
  <text x="320" y="263" text-anchor="middle" fill="#273640" font-family="system-ui, sans-serif" font-size="20">Raw: 4   Observed: 3   Missing: 1   Mean: 17 °C</text>
</svg>
